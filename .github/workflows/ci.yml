name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.18.1 --activate && pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build library and schemas
        run: pnpm run build

      - name: Unit and integration tests
        run: pnpm test

      - name: Validate example documents
        run: pnpm run validate:examples

      - name: Validate specification and conformance cases
        run: pnpm run validate:spec

      - name: Architecture, maturity and balanced-GL gates
        run: pnpm run audit:reference

      - name: Build reference application
        run: pnpm run build:reference

      - name: Build companion workspace control app
        run: pnpm run build:workspace-control

      - name: Compiler benchmarks sanity verification
        run: pnpm run bench:compilers

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test and install Java UIDL Generator
        run: |
          chmod +x ./mvnw
          ./mvnw install
        working-directory: server/uidl-generator

      - name: Test Quarkus Server REST API
        run: |
          chmod +x ./mvnw
          ./mvnw test
        working-directory: server/uidl-server

      - name: Test Android Native Runtime
        run: |
          chmod +x ./mvnw
          ./mvnw test
        working-directory: runtime-android

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Test Flutter Native Runtime
        run: |
          flutter pub get
          flutter test
        working-directory: runtime-flutter

  visual-reference:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.18.1 --activate && pnpm install --frozen-lockfile

      - name: Install canonical browser
        run: npx playwright install --with-deps chrome

      - name: Run visual reference tests
        run: pnpm run test:reference:visual

      - name: Verify administration layout geometry and contrast
        run: pnpm run test:layout
