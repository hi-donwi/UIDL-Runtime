name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Secret + dependency gate via the pinned agent-secure engine (see
# hi-donwi/Agent-Secure). No allow entries yet: the verdict must be a clean
# pass, and any future fixture would need a reason + expiry to gate green.
jobs:
  security:
    uses: hi-donwi/Agent-Secure/.github/workflows/agent-secure-gate.yml@47dd73ad270d88b79043f900e0cdf4915de94b0e
    with:
      root: .
      engine_version: v0.1.3
      engine_sha256: f19b92d17d8c92f0ef8f60a102ead1fe306df23b60cccf42b456a01ecde8202a
      gitleaks_version: 8.30.1
      osv_scanner_version: 2.5.1

  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build library and schemas
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Validate example documents
        run: npm run validate:examples

      - name: Validate specification and conformance cases
        run: npm run validate:spec

      - name: Architecture, maturity and balanced-GL gates
        run: npm run audit:reference

      - name: Build reference application
        run: npm run build:reference

  visual-reference:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install canonical browser
        run: npx playwright install --with-deps chrome

      - name: Run visual reference tests
        run: npm run test:reference:visual
