name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Secret + dependency gate via the pinned agent-secure engine (see
# hi-donwi/Agent-Secure). No allow entries yet: the verdict must be a clean
# pass, and any future fixture would need a reason + expiry to gate green.
jobs:
  security:
    uses: hi-donwi/Agent-Secure/.github/workflows/agent-secure-gate.yml@1dffc4ca7e00bb4e9aa108603fcf02cfeb1637a8
    with:
      root: .
      engine_version: v0.1.5
      engine_sha256: 491c0f4b9b4fe379b13f85be0a8956343a6731694e714763d33b3827e65649c9
      gitleaks_version: 8.30.1
      gitleaks_sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      osv_scanner_version: 2.5.1
      osv_scanner_sha256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be

  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build library and schemas
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Validate example documents
        run: npm run validate:examples

      - name: Validate specification and conformance cases
        run: npm run validate:spec

      - name: Architecture, maturity and balanced-GL gates
        run: npm run audit:reference

      - name: Build reference application
        run: npm run build:reference

      - name: Build companion workspace control app
        run: npm run build:workspace-control

      - name: Compiler benchmarks sanity verification
        run: npm run bench:compilers

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test and install Java UIDL Generator
        run: |
          chmod +x ./mvnw
          ./mvnw install
        working-directory: server/uidl-generator

      - name: Test Quarkus Server REST API
        run: |
          chmod +x ./mvnw
          ./mvnw test
        working-directory: server/uidl-server

      - name: Test Android Native Runtime
        run: |
          chmod +x ./mvnw
          ./mvnw test
        working-directory: runtime-android

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Test Flutter Native Runtime
        run: |
          flutter pub get
          flutter test
        working-directory: runtime-flutter

  visual-reference:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install canonical browser
        run: npx playwright install --with-deps chrome

      - name: Run visual reference tests
        run: npm run test:reference:visual
