name: Publish GitHub Packages mirror

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@hi-donwi"

      - run: npm ci

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v${version}."
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build library and schemas
        run: npm run build

      - name: Validate example documents
        run: npm run validate:examples

      - name: Architecture, maturity and balanced-GL gates
        run: npm run audit:reference

      - name: Build and smoke-test package artifact
        run: npm run smoke:package

      - name: Rename package for GitHub Packages
        run: npm pkg set name=@hi-donwi/uidl-runtime

      - name: Publish mirror to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
