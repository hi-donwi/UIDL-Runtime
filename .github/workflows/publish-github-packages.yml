name: Publish GitHub Packages mirror

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Expected package version to publish, with or without a leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@hi-donwi"

      - run: npm ci

      - name: Check requested version matches package version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          version="$(node -p "require('./package.json').version")"
          requested="${REQUESTED_VERSION#v}"
          if [ "$version" != "$requested" ]; then
            echo "Requested version ${REQUESTED_VERSION} does not match package version ${version}."
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build library and schemas
        run: npm run build

      - name: Validate example documents
        run: npm run validate:examples

      - name: Architecture, maturity and balanced-GL gates
        run: npm run audit:reference

      - name: Build and smoke-test package artifact
        run: npm run smoke:package

      - name: Rename package for GitHub Packages
        run: npm pkg set name=@hi-donwi/uidl-runtime

      - name: Publish mirror to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
