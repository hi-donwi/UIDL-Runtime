name: Verify npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to install from npm
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install and import the public package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package="uidl-runtime@${VERSION#v}"
          npm init -y >/dev/null
          npm install "${package}" --ignore-scripts
          # The page recipes need nothing else: React is the renderer's optional peer.
          for name in react react-dom; do
            if [ -e "node_modules/${name}" ]; then
              echo "npm installed ${name} with ${package} alone" >&2
              exit 1
            fi
          done
          node --input-type=module -e '
            const { compilePage, PAGE_RECIPES } = await import("uidl-runtime/recipes");
            const doc = compilePage({
              recipe: "list",
              meta: { name: "items", label: { id: "Item", en: "Items" }, titleField: "name", fields: [{ key: "name", label: { id: "Nama", en: "Name" }, widget: "TextField" }], columns: [{ field: "name" }], defaultSort: { field: "name", dir: "asc" } },
              hostCapabilities: { collections: ["items"], commands: [] },
            });
            if (!doc.root || PAGE_RECIPES.length < 7) throw new Error("recipes did not compile a list page");
          '
          # A renderer host installs React itself, as the peer requires.
          npm install react react-dom --ignore-scripts
          node --input-type=module -e '
            const m = await import("uidl-runtime");
            for (const name of ["DocumentSchema", "UIDocumentRenderer", "meridianLightTheme"]) {
              if (!m[name]) throw new Error(`missing expected export: ${name}`);
            }
          '
          test -f node_modules/uidl-runtime/dist/style.css
