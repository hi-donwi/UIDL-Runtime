name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Expected package version to publish, with or without a leading v
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Check manual dispatch uses default branch
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Manual publish must run from ${DEFAULT_BRANCH}; current ref is ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Check requested version matches package version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          version="$(node -p "require('./package.json').version")"
          requested="${REQUESTED_VERSION#v}"
          if [ "$version" != "$requested" ]; then
            echo "Requested version ${REQUESTED_VERSION} does not match package version ${version}."
            exit 1
          fi

      - name: Check package version is not already on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "uidl-runtime@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "uidl-runtime@${version} is already published on npm."
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build library and schemas
        run: npm run build

      - name: Validate example documents
        run: npm run validate:examples

      - name: Architecture, maturity and balanced-GL gates
        run: npm run audit:reference

      - name: Build and smoke-test package artifact
        run: npm run smoke:package

      - name: Publish to npm
        run: npm publish
