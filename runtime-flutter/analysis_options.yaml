include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    avoid_print: error
    avoid_web_libraries_in_flutter: error
    cancel_subscriptions: error
    close_sinks: error
    noop_primitive_operations: warning
    prefer_const_constructors: warning
    prefer_const_declarations: warning
    prefer_final_fields: warning
    prefer_final_locals: warning
    prefer_is_empty: warning
    prefer_is_not_empty: warning
    unnecessary_const: warning
    unnecessary_new: warning
    unnecessary_this: warning
    use_key_in_widget_constructors: warning

linter:
  rules:
    - avoid_print
    - avoid_web_libraries_in_flutter
    - cancel_subscriptions
    - close_sinks
    - noop_primitive_operations
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - unnecessary_const
    - unnecessary_new
    - unnecessary_this
    - use_key_in_widget_constructors
    - annotate_overrides
    - avoid_unnecessary_containers
    - prefer_is_not_empty
    - sized_box_for_whitespace
    - use_full_hex_values_for_flutter_colors
    - unnecessary_string_interpolations
    - prefer_if_null_operators
    - avoid_redundant_argument_values
    - prefer_typing_uninitialized_variables
    - no_leading_underscores_for_local_identifiers
    - unnecessary_nullable_for_final_variable_declarations
    - use_super_parameters
    - avoid_function_literals_in_foreach_call
    - prefer_collection_literals
    - prefer_adjacent_string_concatenation
    - prefer_interpolation_to_compose_strings
    - unnecessary_lambdas
    - use_function_type_syntax_for_parameters
    - require_trailing_commas
